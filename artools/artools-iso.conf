#!/hint/bash
# shellcheck disable=2034
#
# MorvaneOS overrides for artools-iso. build.sh mounts this folder at
# ~/.config/artools inside the build container, and mounts the repo at /morvane.
# Anything not set here falls back to the defaults in /etc/artools/artools-iso.conf.

# Profiles are read from ${WORKSPACE_DIR}/iso-profiles
WORKSPACE_DIR=/morvane

# ISOs land in ${ISO_POOL}/<profile>, i.e. out/morvane/ in the repo
ISO_POOL=/morvane/out

INITSYS=runit

STABILITY=stable
