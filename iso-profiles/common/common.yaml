---
# Packages common in all profiles

packages-base:
  - base
  - intel-ucode
  - amd-ucode
  - acpi
  - alsa-firmware
  - b43-fwcutter
  - btrfs-progs
  - diffutils
  - dosfstools
  - efibootmgr
  - e2fsprogs
  - exfatprogs
  - f2fs-tools
  - grub
  - inetutils
  - iptables
  - linux
  - linux-firmware
  - lsb-release
  - memtest86+
  - mkinitcpio
  - mkinitcpio-openswap
  - nano
  - ntfs-3g
  - os-prober
  - sudo
  - sysfsutils
  - usbutils
  - which
  - xfsprogs
packages-apps: []
packages-xorg: []
packages-xlibre:
  - xlibre-xserver
  - xlibre-xf86-input-vmmouse
  - xlibre-xf86-input-wacom
  - xlibre-xf86-video-amdgpu
  - xlibre-xf86-video-ati
  - xlibre-xf86-video-dummy
  - xlibre-xf86-video-fbdev
  - xlibre-xf86-video-intel
  - xlibre-xf86-video-nouveau
  - xlibre-xf86-video-sisusb
  - xlibre-xf86-video-qxl
  - xlibre-xf86-video-vesa
  - xlibre-xf86-video-voodoo
packages-misc: []
packages-init:
  runit:
    - elogind-runit
    - dbus-runit
    - acpid-runit
    - cryptsetup-runit
    - dhcpcd-runit
    - lvm2-runit
    - openssh-runit
# bootfs is a throwaway layer used only to build the initramfs; it never ends up
# in the ISO. linux-headers is here because artools reads the kernel version
# from /usr/src/linux/version, which only the headers package provides.
packages-boot:
  - iso-initcpio
  - linux-headers
