---

live-session:
  user: morvane
  password: morvane
  autologin: true
  use-xlibre: false
  services:
    - acpid
    - syslog-ng
    - iwd
    - dhcpcd
  user-services:
    - dbus
rootfs:
  packages:
    - terminus-font
    - iwd
    - broadcom-wl
    - artix-grub-theme
  packages-init:
    runit:
      - syslog-ng-runit
      - iwd-runit
livefs:
  packages:
    - mkinitcpio-nfs-utils
    - squashfs-tools
    - artix-grub-live
    - artools-base
    - python
    - python-textual
  packages-init:
    runit:
      - artix-live-runit
