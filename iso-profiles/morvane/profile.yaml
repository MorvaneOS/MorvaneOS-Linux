---

live-session:
  user: morvane
  password: morvane
  autologin: true
  use-xlibre: false
  services:
    - acpid
    - syslog-ng
    - iwd
    - dhcpcd
    - morvane-test-ssh  # SSH only inside ./test VMs; see live-overlay/etc/runit/sv/morvane-test-ssh
  user-services:
    - dbus
rootfs:
  packages:
    - terminus-font
    - iwd
    - broadcom-wl
    - artix-grub-theme  # unused, but buildiso fails without it (copies themes/artix)
  packages-init:
    runit:
      - syslog-ng-runit
      - iwd-runit
livefs:
  packages:
    - mkinitcpio-nfs-utils
    - squashfs-tools
    - artix-grub-live
    - artools-base
    - python
    - python-textual
    - morvane-installer
  packages-init:
    runit:
      - artix-live-runit
