# MorvaneOS live ISO boot menu, with the MorvaneOS GRUB theme.
#
# Replaces the grub.cfg from Artix's artix-grub-live package. buildiso copies
# every *.cfg in /usr/share/grub/cfg of the live filesystem into the ISO, and
# this overlay is applied after the package, so these files win.
#
# buildiso also copies /usr/share/grub/themes/artix into the ISO; the
# morvane-grub-theme package installs the MorvaneOS theme there.

insmod part_gpt
insmod part_msdos

if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
fi

# Graphical menu with the theme; plain text if the machine can't do graphics
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
set gfxmode=auto
set gfxpayload=keep
if terminal_output gfxterm; then
    for font in jetbrains_mono_regular_14 jetbrains_mono_regular_16 jetbrains_mono_regular_20 jetbrains_mono_bold_20; do
        loadfont /boot/grub/themes/artix/${font}.pf2
    done
    set theme=/boot/grub/themes/artix/theme.txt
    export theme
else
    terminal_output console
fi

timeout=10
default=0

# Booted as an ISO file from another GRUB (e.g. Ventoy): tell the initramfs
# where the image is. Same behaviour as Artix's menu.
if [ -n "${iso_path}" ]; then
    auto="img_dev=/dev/disk/by-uuid/${rootuuid} img_loop=${iso_path}"
    export auto
fi

source /boot/grub/kernels.cfg

if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI firmware settings" {
        fwsetup
    }
elif [ -f /boot/memtest ]; then
    menuentry "Memory test (memtest86+)" {
        linux16 /boot/memtest
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
