# Boot entry for the live system. buildiso fills in @kopts@ (the ISO label and
# overlay=livefs) when it builds the ISO, so the placeholder must stay.
# lang/keytable/tz are the live defaults Artix's menu passed; the live scripts
# read them to set up locale, keyboard and clock.
menuentry "MorvaneOS (x86_64)" {
    linux /boot/vmlinuz-x86_64 @kopts@ lang=en_US keytable=us tz=UTC ${auto}
    initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
